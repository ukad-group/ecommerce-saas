apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecomm-api
  namespace: westbay-ecommerce
  labels:
    app: ecomm-api
    app.kubernetes.io/name: ecomm-api
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ecomm-api
  template:
    metadata:
      labels:
        app: ecomm-api
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ukad-docker-registry
      containers:
        - name: ecomm-api
          image: ukad/ecommerce-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ConnectionStrings__DefaultConnection
              value: Data Source=/app/data/ecomm.db
          envFrom:
            - secretRef:
                name: ecomm-api
                optional: true
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ecomm-api-data
        - name: uploads
          persistentVolumeClaim:
            claimName: ecomm-api-uploads
      restartPolicy: Always
