name: CI/CD Frontend

on:
  push:
    branches: [feature/project-integration]
    paths:
      - "frontend/**"
      - "deployment/k8s/frontend/**"
      - "deployment/k8s/namespace.yml"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "deployment/k8s/frontend/**"
      - "deployment/k8s/namespace.yml"
      - ".github/workflows/ci-frontend.yml"
  workflow_dispatch:

concurrency:
  group: ci-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY_USERNAME: ukad
  IMAGE_NAME: westbay-ecommerce-frontend
  K8S_NAMESPACE: westbay-ecommerce
  VITE_API_BASE_URL: https://westbay-ecommerce-api.k3s.l01.ukad.dev/api/v1
  VITE_TENANT_ID: tenant-a

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Vite
        id: vite_cache
        uses: actions/cache@v6
        with:
          path: frontend/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('frontend/package-lock.json', 'frontend/vite.config.*') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Type-check
        id: type_check
        run: npm run type-check

      - name: Test
        id: test
        run: npm test -- --run

      - name: Build
        id: build
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          VITE_TENANT_ID: ${{ env.VITE_TENANT_ID }}
        run: npm run build

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    environment:
      name: development
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Set version
        id: set_version
        run: |
          ver="$(date +%Y%m%d-%H%M)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        id: login_dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        id: build_push
        uses: docker/build-push-action@v7
        with:
          context: frontend/
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_TENANT_ID=${{ env.VITE_TENANT_ID }}
          tags: |
            ${{ env.REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.set_version.outputs.version }}
            ${{ env.REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    environment:
      name: development
      url: https://westbay-ecommerce.k3s.l01.ukad.dev
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup kubectl
        id: setup_kubectl
        uses: azure/setup-kubectl@v5

      - name: Set k8s context
        id: set_context
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Ensure namespace
        id: ensure_namespace
        run: kubectl apply -f deployment/k8s/namespace.yml

      - name: Deploy to Kubernetes
        id: deploy
        uses: azure/k8s-deploy@v7
        with:
          action: deploy
          strategy: basic
          namespace: ${{ env.K8S_NAMESPACE }}
          manifests: |
            deployment/k8s/frontend/certificate.yml
            deployment/k8s/frontend/deployment.yml
            deployment/k8s/frontend/service.yml
            deployment/k8s/frontend/ingress.yml
          images: |
            ${{ env.REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }}
